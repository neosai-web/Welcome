<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お前は暇なのか？</title>
    <style>
        body {
            background-color: #000080; /* Windows 95クラシックの濃い青 */
            color: #FFFFFF;
            font-family: "MS Gothic", "Osaka", monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* メインのメッセージエリア */
        .main-container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            color: #FFFF00; /* 蛍光黄色 */
            text-shadow: 2px 2px #000000;
            margin: 0;
            font-weight: bold;
        }

        /* 流れる顔文字エリア */
        .marquee-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-emoticon {
            position: absolute;
            white-space: nowrap;
            font-size: 1.5rem;
            font-weight: bold;
            opacity: 0.85;
            user-select: none;
        }
    </style>
</head>
<body>
    
    <!-- メインコンテンツ -->
    <div class="main-container">
        <h1>お前は暇なのか?</h1>
    </div>

    <!-- 顔文字が流れる背景コンテナ -->
    <div class="marquee-container" id="marqueeContainer"></div>

    <script>
        // 平成初期風の笑う顔文字リスト
        const emoticons = [
            "(^_^)v", "(^o^)", "(￣ー￣)", "(≧∇≦)", 
            "(*^^* )", "(笑)", "（＾∀＾）", "d(^-^)b", 
            "(*^▽^*)", "(^3^)", "(*^.^*)"
        ];

        const container = document.getElementById('marqueeContainer');
        const emoticonCount = 15; // 画面上に同時に流れる数

        // ランダムな数値を生成するヘルパー関数
        function getRandom(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 顔文字要素を生成して流す関数
        function createEmoticon() {
            const el = document.createElement('div');
            el.className = 'floating-emoticon';
            el.innerText = emoticons[Math.floor(Math.random() * emoticons.length)];
            
            // ランダムな色を設定
            const colors = ['#00FF00', '#FFFF00', '#00FFFF', '#FF00FF', '#FFFFFF'];
            el.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            const startY = getRandom(5, 90); // 画面の縦位置 (%)
            el.style.top = startY + 'vh';
            
            // 右端の外からスタート
            let currentX = window.innerWidth;
            el.style.left = currentX + 'px';
            
            // ランダムな速度
            const speed = getRandom(1.5, 4.0);
            
            container.appendChild(el);

            // アニメーションループ
            function move() {
                currentX -= speed;
                el.style.left = currentX + 'px';
                
                // 画面左端を通り過ぎたら要素を消して再生成
                if (currentX < -150) {
                    el.remove();
                    createEmoticon();
                } else {
                    requestAnimationFrame(move);
                }
            }
            requestAnimationFrame(move);
        }

        // 初期化：複数の顔文字をバラバラのタイミングで配置
        window.onload = function() {
            for (let i = 0; i < emoticonCount; i++) {
                setTimeout(() => {
                    createEmoticon();
                }, i * 400);
            }
        };
    </script>
</body>
</html>
